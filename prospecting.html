<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton Mining — Prospecting</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=340">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./tokens.css?v=340">
    <link rel="stylesheet" href="./shared.css?v=340">
    <script src="./brand-migrate.js?v=340"></script>
    <script src="./theme.js?v=340"></script>
    <style>
        /* ---- the section's own nav ---- */
        .psec-nav { display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--line);
                    margin: 0 0 20px; }
        .psec-tab { padding:9px 14px; font-size:12px; letter-spacing:.04em; color:var(--plat-400);
                    text-decoration:none; border-bottom:2px solid transparent; }
        .psec-tab:hover { color:var(--plat-200); }
        .psec-tab.is-on { color:var(--btc-300); border-bottom-color:var(--btc-300); }
        /* A view whose page is not built yet is greyed, not linked. A nav item that
           404s teaches people the section is broken. */
        .psec-tab.is-soon { color:var(--plat-600); cursor:default; }

        /* ---- the board ---- */
        .pb-wrap { display:flex; gap:12px; align-items:flex-start; overflow-x:auto;
                   padding-bottom:12px; }
        .pb-col { flex:0 0 232px; background:var(--panel); border:1px solid var(--line);
                  border-top:2px solid var(--line-mid); border-radius:var(--radius); }
        /* TONE, NOT STAGE NAME. Five rules cover any number of stages, so a stage
           added in the config arrives already styled — which is the whole point of
           making stages configurable. The watchlist pills in map.html still key on
           the name; they cover the six that predate this and are left alone. */
        .pb-col.t-neutral  { border-top-color:var(--line-mid); }
        .pb-col.t-active   { border-top-color:var(--btc-300); }
        .pb-col.t-warm     { border-top-color:var(--btc-200); }
        .pb-col.t-positive { border-top-color:var(--pos); }
        .pb-col.t-negative { border-top-color:var(--neg); }

        .pb-colhead { display:flex; justify-content:space-between; align-items:baseline;
                      padding:10px 12px 2px; }
        .pb-collabel { font-size:11px; letter-spacing:.12em; text-transform:uppercase;
                       color:var(--plat-300); }
        .pb-colcount { font-family:var(--mono); font-size:11px; color:var(--plat-500); }
        .pb-colsub { padding:0 12px 8px; font-family:var(--mono); font-size:10.5px;
                     color:var(--plat-500); border-bottom:1px solid var(--line); }
        .pb-drop { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
        .pb-drop.is-over { background:var(--panel-hover); outline:1px dashed var(--btc-300);
                           outline-offset:-3px; }

        .pb-card { background:var(--black); border:1px solid var(--line); border-radius:var(--radius);
                   padding:9px 10px; cursor:grab; display:flex; flex-direction:column; gap:6px; }
        .pb-card:focus-visible { outline:1px solid var(--btc-300); outline-offset:1px; }
        .pb-card.is-dragging { opacity:.45; }
        .pb-card.is-stale { border-color:var(--neg-line); }
        .pb-name { margin:0; font-size:12.5px; line-height:1.3; color:var(--plat-100); font-weight:600; }
        .pb-meta, .pb-foot { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
        .pb-src { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--plat-500); }
        .pb-kw, .pb-days, .pb-score { font-family:var(--mono); font-size:10.5px; color:var(--plat-400); }
        .pb-unit { color:var(--plat-600); }
        .pb-score { color:var(--btc-300); }
        .pb-days.is-stale { color:var(--neg); }
        /* Absent is drawn, never blanked — a card with a silent gap looks complete
           and is not. */
        .pb-absent { font-style:italic; color:var(--plat-600); font-size:10px; }
        .pb-empty { margin:0; padding:10px 2px; font-size:10.5px; color:var(--plat-600); font-style:italic; }

        .p-empty { border:1px solid var(--line); background:var(--panel); border-radius:var(--radius);
                   padding:28px 22px; max-width:640px; }
        .p-empty h2 { margin:0 0 8px; font-size:16px; color:var(--plat-100); }
        .p-empty p { margin:0 0 10px; font-size:13px; line-height:1.6; color:var(--plat-400); }
        .p-note { font-size:11.5px; color:var(--plat-500); margin:14px 0 0; }
        .p-golink { color:var(--btc-300); text-decoration:none; font-size:13px; }
        .p-golink:hover { color:var(--btc-200); }
    </style>
</head>
<body>
<nav id="proton-nav"></nav>

<main class="page-wrap">
    <header style="margin:0 0 4px">
        <h1 style="margin:0;font-size:18px;color:var(--plat-100)">Prospecting</h1>
    </header>
    <div id="prospectNav"></div>

    <section id="boardSection">
        <div class="pb-wrap" id="pboard"></div>
        <p class="p-note" id="boardNote"></p>
    </section>
</main>

<script src="./firebase-config.js?v=340"></script>
<script src="./sync.js?v=340"></script>
<script src="./auth-ui.js?v=340"></script>
<script src="./profile-panel.js?v=340"></script>
<script src="./shared.js?v=340"></script>
<script src="./site-model.js?v=340"></script>
<!-- Before the board, because publish() pushes the configured stage list into
     site-model.js and the board draws its columns from that list. -->
<script src="./crm-config.js?v=340"></script>
<script src="./crm-log.js?v=340"></script>
<script src="./prospect-nav.js?v=340"></script>
<script src="./prospect-board.js?v=340"></script>
<script src="./prospecting.js?v=340"></script>
</body>
</html>
