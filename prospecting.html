<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proton Mining — Prospecting</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=340">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./tokens.css?v=405">
    <link rel="stylesheet" href="./shared.css?v=405">
    <script src="./brand-migrate.js?v=340"></script>
    <script src="./theme.js?v=374"></script>
    <style>
        /* ---- the section's own nav ---- */
        .psec-nav { display:flex; gap:2px; flex-wrap:wrap; border-bottom:1px solid var(--line);
                    margin: 0 0 20px; }
        .psec-tab { padding:9px 14px; font-size:12px; letter-spacing:.04em; color:var(--plat-400);
                    text-decoration:none; border-bottom:2px solid transparent; }
        .psec-tab:hover { color:var(--plat-200); }
        .psec-tab.is-on { color:var(--btc-300); border-bottom-color:var(--btc-300); }
        /* A view whose page is not built yet is greyed, not linked. A nav item that
           404s teaches people the section is broken. */
        .psec-tab.is-soon { color:var(--plat-600); cursor:default; }

        /* ---- the board ---- */
        .pb-wrap { display:flex; gap:12px; align-items:flex-start; overflow-x:auto;
                   padding-bottom:12px; }
        /* Lifted, not outlined. The stage tone moves off the top border and onto the column label:
   a 2px coloured rule capping a borderless card reads as a rendering fault. */
        /* border-top is TRANSPARENT, not absent: .pb-col.t-active and its four siblings below
           set border-top-color, and a colour needs a border to land on. */
        /* FLEXIBLE, NOT FIXED. At a fixed 248px, crm-config's NINE stages made the board
           2,328px wide in a 1,168px column: closed_won and dead -- the two columns that say
           how the pipeline actually ENDS -- were permanently off-screen, and the view whose
           whole job is "see the shape of the pipeline at a glance" required scrolling to see
           its shape. Columns now share the width and shrink to a floor; overflow still works
           past the floor, but it is proportional to stage count rather than constant. */
        .pb-col { flex:1 1 0; min-width:186px; background:var(--card);
                  border:none; border-top:2px solid transparent;
                  border-radius:var(--radius-lg); padding-bottom:4px; }
        /* TONE, NOT STAGE NAME. Five rules cover any number of stages, so a stage
           added in the config arrives already styled — which is the whole point of
           making stages configurable. The watchlist pills in map.html still key on
           the name; they cover the six that predate this and are left alone. */
        .pb-col.t-neutral  { border-top-color:var(--line-mid); }
        .pb-col.t-active   { border-top-color:var(--btc-300); }
        .pb-col.t-warm     { border-top-color:var(--btc-200); }
        .pb-col.t-positive { border-top-color:var(--pos); }
        .pb-col.t-negative { border-top-color:var(--neg); }

        .pb-colhead { display:flex; justify-content:space-between; align-items:baseline;
                      padding:10px 12px 2px; }
        .pb-collabel { font-size:13.5px; letter-spacing:-0.005em; text-transform:none;
                       font-weight:600; color:var(--plat-100); }
        /* The count IS the Board view's answer -- "where is everything stuck" -- and it was an
           11px mono whisper visually subordinate to the card names under it. The app's figure
           idiom, one size down for a column head. */
        .pb-colcount { font-size:18px; font-weight:600; font-variant-numeric:tabular-nums;
                       color:var(--plat-000); }
        .pb-colsub { padding:0 12px 8px; font-family:var(--mono); font-size:10.5px;
                     color:var(--plat-500); }
        .pb-drop { padding:8px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
        .pb-drop.is-over { background:var(--panel-hover); outline:1px dashed var(--btc-300);
                           outline-offset:-3px; }

        /* A card ON a card, so it steps UP in lightness rather than down to black. Black-on-panel
   worked when the column was nearly transparent and the border did the work; against an
   opaque column it reads as a hole cut in the surface. */
        .pb-card { background:var(--card-2); border:1px solid transparent;
                   border-radius:var(--radius); padding:11px 12px; cursor:grab;
                   display:flex; flex-direction:column; gap:7px; transition:background .15s; }
        .pb-card:hover { background:var(--card-hover); }
        .pb-card:focus-visible { outline:1px solid var(--btc-300); outline-offset:1px; }
        .pb-card.is-dragging { opacity:.45; }
        .pb-card.is-stale { border-color:var(--neg-line); }
        .pb-name { margin:0; font-size:12.5px; line-height:1.3; color:var(--plat-100); font-weight:600; }
        .pb-meta, .pb-foot { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
        .pb-src { font-size:10.5px; letter-spacing:0; text-transform:none; color:var(--plat-500); }
        .pb-kw, .pb-days, .pb-score { font-family:var(--mono); font-size:10.5px; color:var(--plat-400); }
        .pb-unit { color:var(--plat-600); }
        .pb-score { color:var(--btc-300); }
        .pb-days.is-stale { color:var(--neg); }
        /* Absent is drawn, never blanked — a card with a silent gap looks complete
           and is not. */
        .pb-absent { font-style:italic; color:var(--plat-600); font-size:10px; }
        .pb-empty { margin:0; padding:10px 2px; font-size:10.5px; color:var(--plat-600); font-style:italic; }

        .p-empty { border:none; background:var(--card); border-radius:var(--radius-lg);
                   padding:28px 22px; max-width:640px; }
        .p-empty h2 { margin:0 0 8px; font-size:16px; color:var(--plat-100); }
        .p-empty p { margin:0 0 10px; font-size:13px; line-height:1.6; color:var(--plat-400); }
        .p-note { font-size:11.5px; color:var(--plat-500); margin:14px 0 0; }
        .p-golink { color:var(--btc-300); text-decoration:none; font-size:13px; }
        .p-golink:hover { color:var(--btc-200); }

        /* ---- Today ---- */
        /* Same argument as the board column: the 2px tone rule was on the left edge. */
        /* Same as .pb-col: the four .pt-sec.t-* rules below colour this left edge. */
        .pt-sec { border:none; border-left:2px solid transparent;
                  background:var(--card); border-radius:var(--radius-lg);
                  margin:0 0 14px; max-width:1100px; overflow:hidden; }
        .pt-sec.t-negative { border-left-color:var(--neg); }
        .pt-sec.t-active   { border-left-color:var(--btc-300); }
        .pt-sec.t-warm     { border-left-color:var(--btc-200); }
        .pt-sec.t-neutral  { border-left-color:var(--line-mid); }
        .pt-sechead { display:flex; align-items:baseline; gap:10px; padding:11px 14px 9px;
                      border-bottom:1px solid var(--line); }
        .pt-sechead h2 { margin:0; font-size:15px; letter-spacing:-0.01em;
                         text-transform:none; font-weight:600; color:var(--plat-100); }
        /* The count is the section's headline number, not a whisper beside it. */
        .pt-count { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums;
                    color:var(--plat-000); }
        .pt-list { list-style:none; margin:0; padding:0; }
        .pt-row { display:grid; grid-template-columns:120px 1fr 1.4fr auto auto;
                  gap:12px; align-items:baseline; padding:9px 14px;
                  border-bottom:1px solid var(--line); font-size:12.5px; }
        .pt-row:last-child { border-bottom:none; }
        .pt-late { font-family:var(--mono); font-size:11px; color:var(--neg); }
        .pt-name { color:var(--plat-100); }
        .pt-what { color:var(--plat-400); }
        .pt-stage { font-size:11.5px; letter-spacing:0; text-transform:none;
                    color:var(--plat-500); }
        .pt-absent { color:var(--plat-600); font-style:italic; }
        .pt-none { margin:0; padding:12px 14px; font-size:12px; color:var(--plat-500);
                   font-style:italic; }
        /* The combined all-clear line the collapsed empty sections fold into. */
        .pt-clear { margin:4px 0 0; font-size:13px; color:var(--plat-500); }
        .pt-done { background:transparent; border:1px solid var(--line-mid);
                   color:var(--plat-300); border-radius:var(--radius); font-size:11px;
                   padding:3px 9px; cursor:pointer; }
        .pt-done:hover { border-color:var(--btc-300); color:var(--btc-300); }
        @media (max-width: 720px) {
            .pt-row { grid-template-columns:1fr auto; }
            .pt-what, .pt-stage { grid-column:1 / -1; }
        }

        /* The next thing owed, on the card, so the board answers "what is
           outstanding here" without opening anything. */
        .pb-due { font-family:var(--mono); font-size:10px; color:var(--plat-500); }
        .pb-due.is-late { color:var(--neg); }

        /* ---- one prospect ---- */
        .pd-head { max-width:1100px; margin:0 0 16px; }
        .pd-back { font-size:11.5px; color:var(--plat-400); text-decoration:none; }
        .pd-back:hover { color:var(--btc-300); }
        .pd-title { margin:6px 0 8px; font-size:19px; color:var(--plat-100); }
        /* The same fact on the board and in the detail header, styled to sit inside a heading
           rather than beside it. Same vocabulary as .src-promoted on the map, because three
           screens using three words for one state is how people stop trusting any of them. */
        .pb-promoted, .pd-promoted { display:inline-block; padding:1px 6px;
            border-radius: var(--radius); font-size:9px; letter-spacing:.06em;
            text-transform:uppercase; font-weight:700; vertical-align:middle;
            background:var(--btc-wash); color:var(--btc-300); border:1px solid var(--line-btc); }
        .pd-promoted { font-size:10px; margin-left:8px; }
        /* PROMOTION AND RIGHT-SIZING. Promoting commits capital, so the form is plain and the
           figures it asks for are named for what they are rather than abbreviated. */
        .pd-promote { padding:12px 14px; }
        .pd-promote-why { margin:0 0 10px; font-size:12px; color:var(--plat-400);
                          max-width:62ch; line-height:1.5; }
        .pd-pgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
                    gap:10px 14px; margin:0 0 10px; }
        .pd-pgrid label { display:flex; flex-direction:column; gap:4px; font-size:10.5px;
                          letter-spacing:.1em; text-transform:uppercase; color:var(--plat-500); }
        .pd-pgrid input { background:var(--surface-2); border:1px solid var(--line);
                          border-radius:var(--radius); color:var(--plat-100);
                          font-family:var(--mono); font-size:12.5px; padding:6px 8px; }
        .pd-pgrid input:focus { outline:none; border-color:var(--line-btc); }
        .pd-opt { text-transform:none; letter-spacing:0; color:var(--plat-600); font-size:10.5px; }
        /* The reference figure. Styled as prose rather than as a value, because it is something
           to read before deciding, not a number to copy into the field above it. */
        .pd-supports { margin:0 0 8px; font-size:12px; color:var(--btc-300);
                       max-width:62ch; line-height:1.5; }
        .pd-note { margin:0 0 10px; font-size:11.5px; color:var(--plat-500); max-width:62ch;
                   line-height:1.5; }
        .pd-btn { background:var(--btc-wash); border:1px solid var(--line-btc);
                  border-radius:var(--radius); color:var(--btc-300); font-size:11px;
                  letter-spacing:.08em; text-transform:uppercase; font-weight:700;
                  padding:7px 14px; cursor:pointer; }
        .pd-btn:hover { background:var(--btc-500); color:var(--plat-000); }
        .pd-projhead { margin:0; padding:10px 14px; font-family:var(--mono); font-size:12px;
                       color:var(--plat-300); border-bottom:1px solid var(--line); }
        .pd-size-head { margin:0; padding:10px 14px; font-size:12.5px; line-height:1.5;
                        max-width:70ch; color:var(--plat-200); }
        .pd-warn { color:var(--btc-300); }
        .pd-ok { color:var(--plat-200); }
        .pd-note-tone { color:var(--plat-300); }
        .pd-size { display:grid; grid-template-columns:auto 1fr; gap:4px 16px;
                   margin:0; padding:2px 14px 10px; font-size:12px; }
        .pd-size dt { color:var(--plat-500); }
        .pd-size dd { margin:0; font-family:var(--mono); color:var(--plat-200); }
        .pd-basis { margin:0; padding:0 14px 10px; font-size:11.5px; color:var(--plat-500);
                    max-width:70ch; line-height:1.5; }
        /* Refusals read as prose, never as a dash in a value slot. "Not measured" and "zero" are
           opposite claims and must not share a rendering. */
        .pd-refused { margin:0; padding:12px 14px; font-size:12px; color:var(--plat-400);
                      max-width:70ch; line-height:1.55; }
        /* ---- The project/prospect link audit ----
           On Today because a project whose prospect is gone has no prospect page. Quiet by
           construction: the block collapses to nothing when every link resolves, so it is a
           finding rather than a permanent fixture. */
        .pla-block { border:1px solid var(--line-btc); background:var(--panel);
                     border-radius:var(--radius); margin:0 0 14px; max-width:1100px;
                     padding:12px 14px; }
        .pla-head { margin:0; font-size:12.5px; line-height:1.6; color:var(--plat-300);
                    max-width:74ch; }
        .pla-warn { color:var(--btc-300); }
        .pla-quiet { margin:8px 0 0; font-size:11.5px; line-height:1.55;
                     color:var(--plat-500); max-width:74ch; }
        .pla-list { list-style:none; margin:10px 0 0; padding:0; }
        .pla-row { display:grid; grid-template-columns:1fr 2fr auto; gap:6px 12px;
                   align-items:baseline; padding:7px 0; border-top:1px solid var(--line);
                   font-size:12px; }
        .pla-what { color:var(--plat-200); }
        .pla-state { display:block; font-family:var(--mono); font-size:10px;
                     letter-spacing:.06em; text-transform:uppercase; color:var(--btc-300); }
        .pla-why { color:var(--plat-400); line-height:1.5; }
        .pla-since { display:block; font-family:var(--mono); font-size:10.5px;
                     color:var(--plat-600); }
        .pla-do { display:flex; gap:6px; }
        /* The only control, and it records rather than repairs. */
        .pla-ack-btn { background:none; border:1px solid var(--line); cursor:pointer;
                       border-radius:var(--radius); color:var(--plat-400); font-size:10px;
                       letter-spacing:.05em; text-transform:uppercase; padding:3px 8px; }
        .pla-ack-btn:hover { color:var(--btc-300); border-color:var(--line-btc); }
        .pla-ack { font-size:11px; color:var(--plat-500); font-style:italic; }
        @media (max-width:560px) { .pla-row { grid-template-columns:1fr; } }
        /* ---- Budget (Stage 4) ----
           Three money columns, always, because budgeted -> committed -> spent is the whole
           point of the ledger and a single "cost so far" would undo it. Tabular figures so the
           three compare down the column without being read. */
        .pd-bud-head { margin:0; padding:12px 14px 6px; font-size:12.5px; line-height:1.6;
                       max-width:74ch; color:var(--plat-300); }
        .pd-bud-cols, .pd-bud-sub { margin:0; padding:6px 14px 4px; font-family:var(--mono);
                       font-size:10px; letter-spacing:.1em; text-transform:uppercase;
                       color:var(--plat-600); }
        .pd-bud-sub { color:var(--plat-400); border-top:1px solid var(--line); margin-top:8px; }
        .pd-bud { list-style:none; margin:0; padding:0 0 6px; }
        /* The category row is the summary and carries the variance; the lines under it are the
           editable detail. Indenting the lines rather than the categories keeps the eye on the
           column that answers "are we over". */
        .pd-bud-cat { display:grid; grid-template-columns:1fr auto 16ch; gap:4px 12px;
                      align-items:baseline; padding:8px 14px 4px;
                      border-top:1px solid var(--line); font-size:12px; }
        .pd-bud-catname { color:var(--plat-200); }
        .pd-bud-catnums, .pd-bud-var { font-family:var(--mono); font-size:11.5px;
                      color:var(--plat-400); font-variant-numeric:tabular-nums; }
        .pd-bud-var { text-align:right; }
        .pd-bud-quiet { color:var(--plat-600); }
        .pd-bud-line { display:grid; grid-template-columns:1fr auto auto; gap:4px 10px;
                      align-items:center; padding:3px 14px 3px 28px; font-size:11.5px;
                      color:var(--plat-400); }
        .pd-bud-what { color:var(--plat-300); }
        .pd-bud-note { display:block; color:var(--plat-600); font-size:11px; }
        .pd-bud-seeded { color:var(--plat-600); font-size:10px; letter-spacing:.06em;
                      text-transform:uppercase; }
        .pd-bud-amts { display:flex; gap:6px; }
        .pd-bud-amt { width:11ch; background:var(--surface-2); border:1px solid var(--line);
                      border-radius:var(--radius); color:var(--plat-200);
                      font-family:var(--mono); font-size:11px; padding:3px 6px;
                      font-variant-numeric:tabular-nums; }
        .pd-bud-amt:focus { outline:none; border-color:var(--line-btc); }
        .pd-bud-rm { background:none; border:1px solid var(--line); border-radius:var(--radius);
                      color:var(--plat-500); cursor:pointer; font-size:12px; line-height:1;
                      padding:2px 6px; }
        .pd-bud-rm:hover { color:var(--btc-300); border-color:var(--line-btc); }
        .pd-bud-co { display:grid; grid-template-columns:1fr auto 12ch auto; gap:4px 10px;
                      align-items:baseline; padding:5px 14px; font-size:11.5px;
                      color:var(--plat-400); border-top:1px solid var(--line); }
        .pd-bud-rev, .pd-bud-seedrow button {
                      background:var(--btc-wash); border:1px solid var(--line-btc);
                      border-radius:var(--radius); color:var(--btc-300); cursor:pointer;
                      font-size:10px; letter-spacing:.05em; text-transform:uppercase;
                      padding:3px 8px; }
        .pd-bud-seedrow { margin:0; padding:0 14px 12px; }
        .pd-bud-seedrow button { font-size:11px; padding:6px 12px; }
        .pd-bud-form { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
                      padding:10px 14px; border-top:1px solid var(--line); }
        .pd-bud-form input[type=text] { flex:1 1 140px; }
        .pd-bud-form input[type=number] { width:12ch; }
        .pd-bud-form input, .pd-bud-form select {
                      background:var(--surface-2); border:1px solid var(--line);
                      border-radius:var(--radius); color:var(--plat-100);
                      font-family:var(--mono); font-size:12px; padding:5px 7px; min-width:0; }
        .pd-bud-form input:focus, .pd-bud-form select:focus {
                      outline:none; border-color:var(--line-btc); }
        .pd-bud-form button[type=submit] {
                      background:var(--btc-wash); border:1px solid var(--line-btc);
                      border-radius:var(--radius); color:var(--btc-300); cursor:pointer;
                      font-size:11px; letter-spacing:.06em; text-transform:uppercase;
                      padding:6px 12px; }
        .pd-bud-hint { flex:1 0 100%; font-size:11.5px; color:var(--plat-500); line-height:1.5;
                      max-width:74ch; }
        @media (max-width:560px) {
            .pd-bud-cat, .pd-bud-line, .pd-bud-co { grid-template-columns:1fr auto; }
            .pd-bud-amts { grid-column:1 / -1; }
        }
        /* ---- Procurement (Stage 6) ----
           The head carries the counts as sentences, because "2 late, 3 unknown" as bare
           numbers invites reading them as one total. Each is its own clause for the same
           reason the model keeps the states apart. */
        .pd-proc-head { margin:0; padding:12px 14px 8px; font-size:12.5px; line-height:1.6;
                        max-width:74ch; color:var(--plat-300); }
        .pd-proc { list-style:none; margin:0; padding:0 0 6px; }
        /* Three columns: what it is, what state it is in, and when. The middle one is fixed so
           the states line up and the eye can run down them; the date column is right-aligned
           and tabular so day counts compare without being read. */
        .pd-proc-row { display:grid; grid-template-columns:1fr 11ch auto; gap:4px 12px;
                       align-items:baseline; padding:7px 14px;
                       border-top:1px solid var(--line); font-size:12px; }
        .pd-proc-what { color:var(--plat-200); }
        .pd-proc-state { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
                         text-transform:uppercase; color:var(--plat-500); }
        .pd-proc-when { font-family:var(--mono); font-size:11.5px; color:var(--plat-400);
                        text-align:right; font-variant-numeric:tabular-nums; }
        /* Tone is carried on the row, not on the date, so a blocked item reads as needing
           attention even when its date is comfortable. */
        .pd-proc-warn .pd-proc-state, .pd-proc-warn .pd-proc-when { color:var(--btc-300); }
        .pd-proc-note .pd-proc-state { color:var(--plat-300); }
        /* A fourth column for the controls. The stored status and the derived state are
           deliberately not the same control: 'late' is computed and nobody can type it away. */
        .pd-proc-row { grid-template-columns:1fr 11ch auto auto; }
        .pd-proc-vendor { color:var(--plat-500); font-size:11px; }
        .pd-proc-do { display:flex; gap:6px; align-items:center; }
        /* Narrow on purpose: it holds a week count, and a wider field invites a date. Blank is
           a real value here and means unknown, which is why it carries no placeholder zero. */
        .pd-proc-wk { width:6ch; background:var(--surface-2); border:1px solid var(--line);
                      border-radius:var(--radius); color:var(--plat-200);
                      font-family:var(--mono); font-size:10.5px; padding:2px 4px;
                      font-variant-numeric:tabular-nums; }
        .pd-proc-wk:focus { outline:none; border-color:var(--line-btc); }
        .pd-proc-set { background:var(--surface-2); border:1px solid var(--line);
                       border-radius:var(--radius); color:var(--plat-300);
                       font-family:var(--mono); font-size:10.5px; padding:2px 4px; }
        .pd-proc-set:focus { outline:none; border-color:var(--line-btc); }
        .pd-proc-rm { background:none; border:1px solid var(--line); border-radius:var(--radius);
                      color:var(--plat-500); cursor:pointer; font-size:12px; line-height:1;
                      padding:2px 6px; }
        .pd-proc-rm:hover { color:var(--btc-300); border-color:var(--line-btc); }

        /* ---- the counterparty block ---- */
        .pd-cp-person { font-size:14px; color:var(--plat-100); margin:0 0 4px; }
        .pd-cp-person a { color:var(--btc-300); text-decoration:none; }
        .pd-cp-person a:hover { color:var(--btc-200); }
        .pd-cp-owner { display:flex; gap:10px; font-size:12.5px; color:var(--plat-200);
                       margin:0 0 6px; }
        .pd-cp-k { color:var(--plat-500); flex:0 0 84px; }
        .pd-cp-routes { list-style:none; margin:8px 0 10px; padding:0; }
        .pd-cp-routes li { padding:5px 0; font-size:12.5px; }
        .pd-cp-routes a { color:var(--btc-300); text-decoration:none; }
        .pd-cp-routes a:hover { color:var(--btc-200); }
        .pd-cp-why { display:block; font-size:11.5px; color:var(--plat-500); max-width:62ch; }

        /* ---- the gate checklist ---- */
        .pd-gate-list { list-style:none; margin:0 0 12px; padding:0; }
        .pd-gate-item { display:flex; align-items:center; gap:10px; flex-wrap:wrap;
                        padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
        .pd-gate-item:last-child { border-bottom:none; }
        .pd-gate-item.is-done .pd-gate-label { color:var(--plat-500); }
        .pd-gate-label { color:var(--plat-200); flex:1 1 220px; }
        .pd-gate-block { font-size:10.5px; color:var(--neg); border:1px solid var(--neg-line);
                         border-radius:var(--radius-pill); padding:1px 7px; margin-left:6px; }
        .pd-gate-set { background:var(--surface-2); border:1px solid var(--line);
                       border-radius:var(--radius); color:var(--plat-300);
                       font-family:var(--mono); font-size:10.5px; padding:2px 4px; }
        .pd-gate-set:focus { outline:none; border-color:var(--line-btc); }
        .pd-gate-await { font-size:11px; color:var(--btc-300); font-style:italic; }
        .pd-gate-waived { font-size:11px; color:var(--plat-500); font-style:italic; }
        .pd-gate-waive, .pd-gate-unwaive, .pd-gate-cancel {
                       background:none; border:1px solid var(--line); border-radius:var(--radius);
                       color:var(--plat-400); cursor:pointer; font-size:11px; padding:3px 9px; }
        .pd-gate-waive:hover, .pd-gate-unwaive:hover { color:var(--btc-300);
                       border-color:var(--line-btc); }
        .pd-gate-cancel { margin-left:10px; }
        .pd-gate-cancel:hover { color:var(--neg); border-color:var(--neg-line); }
        .pd-gate-adv { background:var(--btc-wash); border:1px solid var(--line-btc);
                       border-radius:var(--radius); color:var(--btc-300); cursor:pointer;
                       font-size:12px; font-weight:600; padding:6px 14px; }
        .pd-gate-adv:hover { background:var(--btc-300); color:var(--black); }
        @media (max-width:560px) {
            /* The state column stops being worth a third of a narrow screen. */
            .pd-proc-row { grid-template-columns:1fr auto; }
            .pd-proc-state { grid-column:1 / -1; order:3; }
            .pd-proc-do { grid-column:1 / -1; order:4; }
        }
        /* ---- The forms on both ledger panels ----
           One rule set, because they are the same object: a dense row of inputs that wraps, with
           a full-width note under it. Keeping them visually identical is the point — they are
           the same act on two ledgers, and two different-looking forms would imply otherwise. */
        .pd-proc-form, .pd-ct-form { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
                                     padding:10px 14px; border-top:1px solid var(--line); }
        .pd-proc-form input[type=text], .pd-proc-form input[type=number],
        .pd-ct-form input[type=text], .pd-ct-form input[type=number],
        .pd-proc-form input[type=date], .pd-ct-form input[type=date],
        .pd-ct-form select {
            background:var(--surface-2); border:1px solid var(--line);
            border-radius:var(--radius); color:var(--plat-100);
            font-family:var(--mono); font-size:12px; padding:5px 7px; min-width:0; }
        .pd-proc-form input[type=text] { flex:1 1 160px; }
        .pd-ct-form input[type=text] { flex:1 1 140px; }
        .pd-proc-form input[type=number], .pd-ct-form input[type=number] { width:11ch; }
        .pd-proc-form input:focus, .pd-ct-form input:focus,
        .pd-ct-form select:focus { outline:none; border-color:var(--line-btc); }
        .pd-proc-form button, .pd-ct-form button[type=submit] {
            background:var(--btc-wash); border:1px solid var(--line-btc);
            border-radius:var(--radius); color:var(--btc-300); cursor:pointer;
            font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:6px 12px; }
        .pd-proc-need, .pd-proc-perm, .pd-ct-ins {
            display:flex; gap:6px; align-items:center; font-size:10.5px; letter-spacing:.06em;
            text-transform:uppercase; color:var(--plat-500); }
        /* Full width on its own line: it is a sentence explaining why a field may be left empty,
           and inline it would be read as a field label. */
        .pd-proc-hint, .pd-ct-hint { flex:1 0 100%; font-size:11.5px; color:var(--plat-500);
                                     line-height:1.5; max-width:74ch; }
        /* ---- Contractors (Stage 7) ----
           Same three-column shape as the procurement rows, because they are read the same way:
           down the state column first, then across to the number. The state column is wider
           here — 'conditional' and 'terminated' are the longest labels the model can produce
           and both wrapped to two lines at 11ch. */
        .pd-ct-head { margin:0; padding:12px 14px 8px; font-size:12.5px; line-height:1.6;
                      max-width:74ch; color:var(--plat-300); }
        .pd-ct { list-style:none; margin:0; padding:0 0 6px; }
        .pd-ct-row { display:grid; grid-template-columns:1fr 13ch auto auto; gap:4px 12px;
                     align-items:baseline; padding:7px 14px;
                     border-top:1px solid var(--line); font-size:12px; }
        /* The insurance date edits in place because it is the one field on a contractor that
           genuinely changes, and chasing a renewal is the commonest edit anyone makes here. The
           contract sum deliberately does not: the model closes it at the first certificate, so
           an input offering to change it would be inviting a refusal. */
        .pd-ct-do { display:flex; gap:6px; align-items:center; }
        .pd-ct-ins-set { background:var(--surface-2); border:1px solid var(--line);
                     border-radius:var(--radius); color:var(--plat-300);
                     font-family:var(--mono); font-size:10.5px; padding:2px 4px; }
        .pd-ct-ins-set:focus { outline:none; border-color:var(--line-btc); }
        .pd-ct-rm { background:none; border:1px solid var(--line); border-radius:var(--radius);
                     color:var(--plat-500); cursor:pointer; font-size:12px; line-height:1;
                     padding:2px 6px; }
        .pd-ct-rm:hover { color:var(--btc-300); border-color:var(--line-btc); }
        .pd-ct-who { color:var(--plat-200); }
        /* The trade sits with the name rather than in a column of its own: it is how a reader
           recognises the firm, not something they scan down. */
        .pd-ct-trade { color:var(--plat-500); font-size:11px; }
        .pd-ct-state { font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
                       text-transform:uppercase; color:var(--plat-500); }
        .pd-ct-when { font-family:var(--mono); font-size:11.5px; color:var(--plat-400);
                      text-align:right; font-variant-numeric:tabular-nums; }
        /* Tone on the row, as with procurement, so an uninsured firm reads as urgent even
           though its figure is a day count rather than money. */
        .pd-ct-warn .pd-ct-state, .pd-ct-warn .pd-ct-when { color:var(--btc-300); }
        .pd-ct-note .pd-ct-state { color:var(--plat-300); }
        /* THE APPLICATIONS SIT UNDER THEIR CONTRACTOR, INDENTED, not in a table of their own.
           A payment only means anything against the contract it is drawn on, and a flat list of
           applications across every firm is where a reader loses track of which lien position
           they are looking at. */
        .pd-ct-apps { list-style:none; margin:6px 0 2px; padding:0 0 0 14px;
                      grid-column:1 / -1; border-left:1px solid var(--line); }
        .pd-ct-app { display:grid; grid-template-columns:1fr auto 14ch auto; gap:4px 10px;
                     align-items:baseline; padding:4px 0; font-size:11.5px;
                     color:var(--plat-400); }
        .pd-ct-app-no { color:var(--plat-300); font-family:var(--mono); }
        .pd-ct-app-amt { font-family:var(--mono); font-variant-numeric:tabular-nums; }
        .pd-ct-ret { color:var(--plat-600); }
        .pd-ct-app-st { font-family:var(--mono); font-size:10.5px; letter-spacing:.05em;
                        text-transform:uppercase; color:var(--plat-500); }
        /* A paid application with no unconditional waiver is the row this whole panel exists
           for, so it is marked on the row rather than only counted in the head. */
        .pd-ct-app-warn .pd-ct-app-st { color:var(--btc-300); }
        .pd-ct-app-do { display:flex; gap:6px; flex-wrap:wrap; }
        .pd-ct-act { background:none; border:1px solid var(--line); border-radius:var(--radius);
                     color:var(--plat-400); cursor:pointer; font-size:10px; letter-spacing:.05em;
                     text-transform:uppercase; padding:3px 8px; }
        .pd-ct-act:hover { color:var(--btc-300); border-color:var(--line-btc); }
        .pd-ct-cos { padding-left:14px; border-left:1px solid var(--line-btc); }
        .pd-ct-sub { margin:0; padding:10px 14px 0; font-size:12px; color:var(--plat-400);
                     max-width:74ch; line-height:1.55; }
        @media (max-width:560px) {
            .pd-ct-row { grid-template-columns:1fr auto; }
            .pd-ct-state { grid-column:1 / -1; order:3; }
            .pd-ct-do { grid-column:1 / -1; order:4; }
            .pd-ct-app { grid-template-columns:1fr auto; }
            .pd-ct-app-st { grid-column:1 / -1; }
        }
        .pd-term { border-top:1px solid var(--line); padding-top:10px; }
        .pd-term-head { margin:0; padding:0 14px 6px; font-size:12.5px; color:var(--plat-200); }
        .pd-directional { color:var(--plat-400); border-top:1px solid var(--line);
                          padding-top:10px; }
        /* The header figures: the app stat-tile idiom, one size down for a header row. */
        .pd-figs { display:flex; flex-wrap:wrap; gap:28px; margin:10px 0 8px; }
        .pd-fig { display:flex; flex-direction:column; gap:3px; }
        .pd-fig-l { font-size:12.5px; color:var(--plat-500); }
        .pd-fig-v { font-size:26px; font-weight:600; letter-spacing:-0.02em; color:var(--plat-000);
                    font-variant-numeric:tabular-nums; line-height:1.12; }
        .pd-fig-unit { font-size:13px; color:var(--plat-500); font-weight:450; }
        .pd-facts { display:flex; flex-wrap:wrap; gap:16px; font-family:var(--mono);
                    font-size:11px; color:var(--plat-400); margin:0 0 10px; }
        .pd-stagepick { display:inline-flex; flex-direction:column; gap:4px;
                        font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
                        color:var(--plat-500); }
        /* Aligned to the bottom of the picker beside it, so the two read as one control group:
           what stage this is, and the one move you are most likely to want. It carries the
           accent because it is the only thing in this header that DOES something -- everything
           else there is a fact. */
        .pd-advance { align-self:flex-end; margin-left:12px;
                      background:var(--btc-wash); border:1px solid var(--line-btc);
                      border-radius:var(--radius); color:var(--btc-300); cursor:pointer;
                      font-size:11px; letter-spacing:.06em; text-transform:uppercase;
                      padding:6px 12px; }
        .pd-advance:hover { background:var(--btc-300); color:var(--bg); }
        /* The board's missing sentence. Prose, not a control: it is read once and then never
           again, so it sits above the columns rather than competing with them. */
        .pb-hint { margin:0 0 10px; font-size:12px; color:var(--plat-400);
                   max-width:74ch; line-height:1.55; }
        .pd-sec { max-width:1100px; border:none; background:var(--card);
                  border-radius:var(--radius-lg); margin:0 0 16px; overflow:hidden; }
        /* Sentence case, larger, and the rule under it goes: a heading does not need a line to be a
   heading once it has size and weight. */
        .pd-sec h3 { margin:0; padding:16px 18px 10px; font-size:16px; letter-spacing:-0.01em;
                     text-transform:none; font-weight:600; color:var(--plat-000);
                     border-bottom:none; }
        .pd-none { margin:0; padding:12px 14px; font-size:12px; color:var(--plat-500);
                   font-style:italic; }
        .pd-absent { color:var(--plat-600); font-style:italic; }

        .pd-form { padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
        .pd-frow { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
        .pd-form label { display:flex; flex-direction:column; gap:4px; font-size:10.5px;
                         letter-spacing:.08em; text-transform:uppercase; color:var(--plat-500); }
        .pd-grow { flex:1 1 160px; } .pd-grow2 { flex:2 1 260px; }
        .pd-form input, .pd-form select {
            background:var(--black); border:1px solid var(--line-mid); color:var(--plat-200);
            border-radius:var(--radius); padding:6px 8px; font-size:12.5px;
            font-family:inherit; text-transform:none; letter-spacing:0; }
        .pd-btn { background:transparent; border:1px solid var(--line-mid); color:var(--plat-300);
                  border-radius:var(--radius); font-size:11.5px; padding:6px 12px; cursor:pointer; }
        .pd-btn:hover { border-color:var(--btc-300); color:var(--btc-300); }
        .pd-btn--go { border-color:var(--btc-300); color:var(--btc-300); }
        .pd-hint { margin:0; font-size:11px; color:var(--plat-600); }
        .pd-hint.is-err { color:var(--neg); }

        .pd-follows, .pd-contacts { list-style:none; margin:0; padding:0; }
        .pd-follows li, .pd-contacts li { display:flex; flex-wrap:wrap; gap:12px;
            align-items:baseline; padding:8px 14px; border-bottom:1px solid var(--line);
            font-size:12.5px; }
        .pd-follows li:last-child, .pd-contacts li:last-child { border-bottom:none; }
        .pd-fdue { font-family:var(--mono); font-size:11px; color:var(--plat-400); }
        .pd-fdue.is-late { color:var(--neg); }
        .pd-fwhat { flex:1 1 auto; color:var(--plat-200); }
        .pd-cname { color:var(--plat-100); }
        .pd-best { font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
                   color:var(--btc-300); }
        .pd-crole, .pd-cver, .pd-calso { font-size:10.5px; color:var(--plat-500); }
        .pd-cways { flex:1 1 auto; font-family:var(--mono); font-size:11px; color:var(--plat-400); }

        .pd-tl { list-style:none; margin:0; padding:0; }
        .pd-ev { display:flex; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line);
                 font-size:12.5px; }
        .pd-ev:last-child { border-bottom:none; }
        .pd-when { font-family:var(--mono); font-size:11px; color:var(--plat-500);
                   flex:0 0 78px; }
        .pd-body { flex:1 1 auto; color:var(--plat-300); }
        .pd-kind { font-size:10px; letter-spacing:.1em; text-transform:uppercase;
                   color:var(--plat-500); }
        .pd-note { display:block; margin-top:3px; color:var(--plat-400); }
        .pd-next { display:block; margin-top:3px; font-size:11px; color:var(--btc-300); }
        /* A corrected entry is struck through rather than replaced. The point of an
           immutable log is seeing what you believed at the time. */
        .pd-ev.is-corrected .pd-note { text-decoration:line-through; color:var(--plat-600); }
        .pd-corr { display:block; margin-top:2px; font-size:10px; color:var(--plat-600);
                   font-style:italic; }
        .pd-pill { font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
                   padding:1px 6px; border-radius:var(--radius); }
        .pd-pill.t-positive { background:var(--pos-line); color:var(--pos); }
        .pd-pill.t-negative { background:var(--neg-wash); color:var(--neg); }
        .pd-pill.t-neutral  { background:var(--line-mid); color:var(--plat-400); }

        /* ---- research ---- */
        .pd-esum { padding:10px 14px; font-size:12.5px; color:var(--plat-400);
                   border-bottom:1px solid var(--line); }
        .pd-esum strong { color:var(--btc-300); font-family:var(--mono); }
        .pd-echecks { list-style:none; margin:0; padding:0; }
        .pd-echecks li { display:flex; flex-wrap:wrap; gap:10px; align-items:center;
                         padding:7px 14px; border-bottom:1px solid var(--line); font-size:12.5px; }
        .pd-echecks li:last-child { border-bottom:none; }
        .pd-echecks li.s-complete .pd-elabel { color:var(--plat-100); }
        .pd-echecks li.s-na .pd-elabel { color:var(--plat-600); text-decoration:line-through; }
        .pd-elabel { flex:1 1 240px; color:var(--plat-300); }
        .pd-estat { background:var(--black); border:1px solid var(--line-mid);
                    color:var(--plat-300); border-radius:var(--radius);
                    padding:4px 6px; font-size:11.5px; }
        .pd-enote { flex:1 1 200px; background:var(--black); border:1px solid var(--line-mid);
                    color:var(--plat-300); border-radius:var(--radius);
                    padding:4px 7px; font-size:11.5px; }
        .pd-ewhen { font-family:var(--mono); font-size:10px; color:var(--plat-600);
                    flex:0 0 66px; text-align:right; }

        /* On the card: a bar you can read across a column. */
        .pb-enrich { display:flex; align-items:center; gap:6px; }
        .pb-ebar { flex:1 1 auto; height:3px; background:var(--line-mid);
                   border-radius:var(--radius); overflow:hidden; }
        .pb-ebar span { display:block; height:100%; background:var(--btc-300); }
        .pb-epct { font-family:var(--mono); font-size:9.5px; color:var(--plat-500); }


        /* ---- documents: a register of where things are, not the things ---- */
        .pd-docs { list-style:none; margin:0 0 10px; padding:0; }
        .pd-doc { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
                  padding:6px 0; border-bottom:1px solid var(--line); font-size:12px; }
        .pd-doc:last-child { border-bottom:0; }
        .pd-dkind { flex:0 0 118px; font-size:10.5px; letter-spacing:.03em;
                    text-transform:uppercase; color:var(--plat-500); }
        .pd-dtitle { flex:1 1 180px; color:var(--plat-100); }
        .pd-dloc { flex:1 1 200px; min-width:0; overflow-wrap:anywhere; }
        .pd-dlink { color:var(--btc-300); text-decoration:none; }
        .pd-dlink:hover { text-decoration:underline; }
        /* Typed, kept, and deliberately not a link. It is shown so it can be
           fixed, not hidden so it looks fine. */
        .pd-dbad { color:var(--plat-500); font-family:var(--mono); font-size:11px; }
        .pd-dwhere { color:var(--plat-400); }
        .pd-dwhen { flex:0 0 78px; text-align:right; font-family:var(--mono);
                    font-size:10.5px; color:var(--plat-500); }
        .pd-drm { flex:0 0 auto; background:none; border:0; cursor:pointer;
                  color:var(--plat-600); font-size:15px; line-height:1; padding:0 2px; }
        .pd-drm:hover { color:var(--neg); }
        .pd-dmiss { margin:0 0 12px; font-size:11px; color:var(--plat-500); }
        .pd-noteform { display:flex; align-items:flex-end; gap:10px; margin:0 0 14px; }
        .pd-noteform textarea { width:100%; resize:vertical; background:var(--black);
                    border:1px solid var(--line-mid); color:var(--plat-200);
                    border-radius:var(--radius); padding:7px 9px; font:inherit;
                    font-size:12px; }
        .pd-ev.k-note .pd-kind { color:var(--plat-400); }
        /* THE BUILD EVENTS, colour-coded by how much they should interrupt a read of the
           timeline. A gate move is orange because it is the project advancing; a waiver is the
           warn colour because it is a hard block being stepped around and should never scan as
           routine; a score movement is dim because it is a consequence rather than a decision;
           money is platinum, matching every other figure in the app. */
        .pd-ev.k-gate .pd-kind   { color:var(--btc-300); }
        .pd-ev.k-waiver .pd-kind { color:var(--warn); }
        .pd-ev.k-score .pd-kind  { color:var(--plat-500); }
        .pd-ev.k-money .pd-kind  { color:var(--plat-200); }
        .pd-ev.k-other .pd-kind  { color:var(--plat-400); }

        @media (max-width: 620px) {
            .pd-dkind { flex-basis:100%; }
            .pd-dwhen { flex:0 0 auto; }
        }

        /* ---- the one-page summary ---- */
        .ps-bar { display:flex; align-items:center; gap:10px; margin:0 0 16px; }
        .ps-bar .pd-back { margin-right:auto; }
        .pd-sumlink { font-size:11px; color:var(--plat-400); text-decoration:none;
                      border:1px solid var(--line-mid); border-radius:var(--radius);
                      padding:4px 9px; }
        .pd-sumlink:hover { color:var(--btc-300); border-color:var(--btc-300); }
        .ps-sheet { max-width:760px; background:var(--panel); border:1px solid var(--line);
                    border-radius:var(--radius); padding:26px 30px 22px; }
        .ps-head { border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px; }
        .ps-head h2 { margin:0 0 6px; font-size:20px; color:var(--plat-100); }
        .ps-standing { margin:0; font-size:12px; color:var(--plat-400); }
        .ps-next { margin:6px 0 0; font-size:12px; color:var(--plat-300); }
        .ps-next.is-late { color:var(--neg); }
        .ps-sec { margin:0 0 20px; }
        .ps-sec h3 { margin:0 0 9px; font-size:11px; letter-spacing:.06em;
                     text-transform:uppercase; color:var(--plat-500); font-weight:600; }
        .ps-facts { display:grid; grid-template-columns:150px 1fr; gap:5px 14px;
                    margin:0; font-size:12.5px; }
        .ps-facts dt { color:var(--plat-500); }
        .ps-facts dd { margin:0; color:var(--plat-100); }
        .ps-note { font-size:10.5px; color:var(--plat-500); }
        /* One representation of absence, everywhere on the sheet. */
        .ps-absent { font-style:italic; color:var(--plat-600); font-size:11.5px; }
        .ps-caveat { margin:0 0 10px; font-size:11.5px; line-height:1.5; color:var(--btc-200);
                     border-left:2px solid var(--btc-200); padding-left:10px; }
        .ps-caveat.is-executed { color:var(--pos); border-left-color:var(--pos); }
        .ps-list { list-style:none; margin:0; padding:0; font-size:12.5px; }
        .ps-list li { padding:4px 0; color:var(--plat-200); border-bottom:1px solid var(--line); }
        .ps-list li:last-child { border-bottom:0; }
        .ps-reach { display:inline-block; margin-left:12px; font-family:var(--mono);
                    font-size:11px; color:var(--plat-400); }
        .ps-dkind { display:inline-block; min-width:112px; font-size:10.5px;
                    text-transform:uppercase; letter-spacing:.03em; color:var(--plat-500); }
        .ps-where { display:block; font-family:var(--mono); font-size:10.5px;
                    color:var(--plat-500); overflow-wrap:anywhere; }
        .ps-where a { color:var(--btc-300); text-decoration:none; }
        .ps-tl { list-style:none; margin:0; padding:0; font-size:12.5px; }
        .ps-tl li { display:flex; gap:12px; padding:4px 0; color:var(--plat-200); }
        .ps-when { flex:0 0 80px; font-family:var(--mono); font-size:11px; color:var(--plat-500); }
        /* The section that makes the rest of the sheet trustworthy, so it is not
           styled as an afterthought at the bottom. */
        .ps-sec--gaps { border:1px solid var(--line-mid); border-radius:var(--radius);
                        padding:14px 16px; background:var(--black); }
        .ps-sec--gaps .ps-list li { border-bottom:0; padding:3px 0; color:var(--plat-300); }
        .ps-sec--gaps strong { color:var(--plat-200); font-weight:500; }
        .ps-foot { margin:0; padding-top:14px; border-top:1px solid var(--line);
                   font-size:10.5px; color:var(--plat-600); }

        /* PRINTING A DARK PAGE. Browsers do not print backgrounds by default, so
           every near-white token would come out white on white -- an invisible
           page that looks fine on screen. Colours are restated for ink. */
        @media print {
            body * { visibility:hidden; }
            #psummary, #psummary * { visibility:visible; }
            #psummary { position:absolute; left:0; top:0; width:100%; }
            .ps-bar { display:none; }
            .ps-sheet { max-width:none; border:0; padding:0; background:#fff;
                        color:#000; }
            .ps-head h2, .ps-facts dd, .ps-list li, .ps-tl li { color:#000; }
            .ps-standing, .ps-next, .ps-facts dt, .ps-note, .ps-when,
            .ps-reach, .ps-dkind, .ps-where { color:#444; }
            .ps-absent, .ps-foot { color:var(--text-dim); }
            .ps-sec h3 { color:#000; }
            .ps-caveat { color:#000; border-left-color:#000; }
            .ps-sec--gaps { background:#fff; border-color:var(--plat-400); }
            .ps-sec--gaps .ps-list li, .ps-sec--gaps strong { color:#000; }
            .ps-head, .ps-list li, .ps-foot { border-color:var(--plat-300); }
            .ps-where a { color:#000; }
            /* A section split across a page break is a section somebody misses. */
            .ps-sec { break-inside:avoid; page-break-inside:avoid; }
        }
        /* ---- analytics ---- */
        /* Every number on this screen is computed from too little data to be a
           number yet, and will be for months. So the styling's whole job is to
           make a thin figure look like what it is. */
        .pa-caveat { margin:0 0 18px; padding:9px 12px; font-size:11.5px; line-height:1.5;
                     color:var(--plat-400); background:var(--panel);
                     border:1px solid var(--line); border-left:2px solid var(--btc-200);
                     border-radius:var(--radius); }
        .pa-sec { margin:0 0 22px; background:var(--panel); border:1px solid var(--line);
                  border-radius:var(--radius); padding:14px 16px 12px; }
        .pa-head { display:flex; align-items:baseline; justify-content:space-between;
                   gap:12px; margin:0 0 12px; }
        .pa-head h2 { margin:0; font-size:12px; letter-spacing:.05em; text-transform:uppercase;
                      color:var(--plat-300); font-weight:600; }
        .pa-n { font-family:var(--mono); font-size:11px; color:var(--plat-500); }
        .pa-none { margin:0; font-size:12px; line-height:1.55; color:var(--plat-500); }
        .pa-thin { margin:10px 0 0; font-size:11px; color:var(--plat-600); }
        .pa-foot { margin:11px 0 0; font-size:11px; line-height:1.55; color:var(--plat-600); }
        .pa-absent { font-size:11px; font-style:italic; color:var(--plat-600); }
        .pa-unit { font-size:10.5px; color:var(--plat-500); }

        .pa-bars { list-style:none; margin:0; padding:0; }
        /* Capped, because a two-count bar stretched across a 1440px page reads as
           a big number. The bar's length is the comparison; the page width is not
           part of the data. */
        .pa-bars li { display:flex; align-items:center; gap:10px; padding:3px 0;
                      max-width:660px; }
        .pa-bl { flex:0 0 132px; font-size:12px; color:var(--plat-200); }
        .pa-bar { flex:1 1 auto; height:8px; background:var(--black);
                  border-radius:var(--radius); overflow:hidden; }
        .pa-bar > span { display:block; height:100%; background:var(--btc-300); }
        /* Deaths with no reason recorded are a gap in the record, not a cause.
           Shown, because hiding them would make the ranked reasons look complete. */
        .pa-bars li.is-unrecorded .pa-bl,
        .pa-bars li.is-unrecorded .pa-bv { color:var(--plat-600); font-style:italic; }
        .pa-bars li.is-unrecorded .pa-bar > span { background:var(--line-mid); }
        .pa-bv { flex:0 0 74px; text-align:right; font-family:var(--mono); font-size:11px;
                 color:var(--plat-300); }
        .pa-bv em { font-style:normal; color:var(--plat-500); }

        .pa-table { width:100%; max-width:780px; border-collapse:collapse; font-size:12px; }
        /* Two columns spread over a full page put the figure so far from its stage
           that the eye loses the row. */
        .pa-table--two { max-width:440px; }
        .pa-table th { text-align:right; font-weight:500; font-size:10.5px;
                       letter-spacing:.04em; text-transform:uppercase;
                       color:var(--plat-600); padding:0 0 6px; border-bottom:1px solid var(--line); }
        .pa-table th:first-child { text-align:left; }
        .pa-table td { padding:5px 0; border-bottom:1px solid var(--line); }
        .pa-table tr:last-child td { border-bottom:0; }
        /* Explicit, not inherited from tbody td:first-child in shared.css. These
           columns read left today because the stage happens to be first; a column
           inserted before it would silently right-align every stage name. */
        .pa-stage { color:var(--plat-200); text-align:left; }
        .pa-stage.t-active   { color:var(--btc-300); }
        .pa-stage.t-warm     { color:var(--btc-200); }
        .pa-stage.t-positive { color:var(--pos); }
        .pa-stage.t-negative { color:var(--neg); }
        .pa-num { text-align:right; font-family:var(--mono); color:var(--plat-200);
                  white-space:nowrap; }
        .pa-of  { text-align:right; font-size:10.5px; color:var(--plat-600);
                  padding-left:12px; white-space:nowrap; }
        /* An empty row is still a row -- the stage exists and nothing is in it. */
        .pa-table tr.is-zero td, .pa-table tr.is-zero .pa-stage { color:var(--plat-600); }

        /* A thin figure keeps its value but loses its authority, and carries the
           count it was computed from right beside it. */
        .pa-fig.is-thin { color:var(--plat-500); }
        .pa-basis { font-family:var(--mono); font-size:10.5px; color:var(--plat-600); }

        .pa-stats { list-style:none; display:flex; flex-wrap:wrap; gap:10px;
                    margin:0; padding:0; }
        .pa-stats li { flex:1 1 118px; background:var(--black); border:1px solid var(--line);
                       border-radius:var(--radius); padding:9px 11px; }
        /* The app's figure idiom: the one screen that summarises the funnel numerically was
           rendering its figures smaller than the map's capital summary, in mono. */
        .pa-sv { display:block; font-size:28px; font-weight:600; letter-spacing:-0.02em;
                 font-variant-numeric:tabular-nums; color:var(--plat-000); line-height:1.15 }
        .pa-sl { display:block; margin-top:4px; font-size:12.5px; color:var(--plat-500); }

        @media (max-width: 620px) {
            .pa-bl { flex-basis:96px; font-size:11px; }
            .pa-sec { padding:12px 12px 10px; }
        }
    </style>
</head>
<body>
<canvas id="gasField" aria-hidden="true"></canvas>
<nav id="proton-nav"></nav>

<main class="page-wrap">
    <header style="margin:0 0 4px">
        <h1 class="page-title" style="margin:0">Prospecting</h1>
    </header>
    <div id="prospectNav"></div>

    <section id="todaySection">
        <!-- The link audit sits ABOVE the follow-ups because it is the rarer and the
             worse news, and because it is the only project-wide surface there is: a
             project whose prospect is gone has no prospect page to be drawn on. It
             renders nothing at all when every link resolves. -->
        <div id="plaudit"></div>
        <div id="ptoday"></div>
    </section>

    <section id="detailSection" hidden>
        <div id="pdetail"></div>
    </section>

    <section id="summarySection" hidden>
        <div id="psummary"></div>
    </section>

    <section id="analyticsSection" hidden>
        <div id="panalytics"></div>
    </section>

    <section id="boardSection" hidden>
        <!-- Both halves are load-bearing. Dragging is the board's only way to move a card and it
             has no affordance -- draggable="true" is set on the article and nothing on screen
             says so. And clicking a card deliberately OPENS it rather than selecting it, which
             is the right call and is also exactly what makes a reader conclude the board cannot
             move anything. Saying both is what stops that conclusion. -->
        <p class="pb-hint">Drag a card between columns to move a prospect through the pipeline.
            Clicking one opens it instead — the stage can also be changed from there.</p>
        <div class="pb-wrap" id="pboard"></div>
        <p class="p-note" id="boardNote"></p>
    </section>
</main>
